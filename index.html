<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牛牛 App 期权首单改版 · 方案 Demo</title>
<meta name="description" content="《期权未首交用户促转化：三个月方案》配套 demo：在牛牛 App 现有的账户页、个股期权 Tab、市场期权 Tab、期权课堂、下单页基础上，标出方案新增和修改的模块。面试作业用，非官方页面。">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#111;--sub:#8a8f99;--line:#ececf0;--or:#ff6a00;--or2:#fff2e8;--blue:#2d7cf6;--up:#e8344e;--dn:#1ab36a;--yellow:#fff7df}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:#e9ebf0;color:var(--ink);min-height:100vh}
a{color:var(--blue)}
.layout{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:16px 16px}
.guide{width:360px;flex:none;background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--line);position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
.guide h1{font-size:15.5px;margin-bottom:4px}
.guide p{font-size:12px;color:var(--sub);line-height:1.5}
.legend{display:flex;gap:8px;margin:10px 0 4px;font-size:12px;align-items:center;flex-wrap:wrap}
.guide .list{margin-top:10px;display:flex;flex-direction:column;gap:3px}
.guide .item{border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12.5px;line-height:1.4;display:flex;justify-content:space-between;align-items:center;gap:6px}
.guide .item:hover{background:#f7f8fa}
.guide .item.on{border-color:var(--or);background:var(--or2)}
.guide .item b{font-weight:600;flex:1}
.guide .item .tag{font-size:10.5px;color:var(--or);background:var(--or2);border-radius:4px;padding:1px 5px;white-space:nowrap;flex:none}
.guide .item.on .tag{background:#fff}
.guide .foot{font-size:10.5px;color:#8f959e;line-height:1.5;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.phone{width:390px;flex:none;height:min(820px,calc(100vh - 32px));position:sticky;top:16px;background:#000;border-radius:44px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
.inner{background:var(--bg);border-radius:34px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:600;background:#fff}
.status .pill{width:110px;height:28px;background:#000;border-radius:14px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden}
.tabbar{height:58px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center}
.tabbar div{flex:1;text-align:center;font-size:10.5px;color:#666;cursor:pointer}
.tabbar div span{display:block;font-size:19px;line-height:22px}
.tabbar div.on{color:var(--or)}
/* 牛牛式页头 */
.nav{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;position:sticky;top:0;z-index:5}
.nav .back{font-size:22px;cursor:pointer;width:18px;line-height:1}
.nav .logo{width:26px;height:26px;border-radius:50%;background:var(--or);flex:none}
.nav b{font-size:19px;flex:1}
.nav .ic{font-size:17px;color:#333;margin-left:10px}
.nav .home{font-size:11px;color:var(--or);cursor:pointer;border:1px solid var(--or);border-radius:12px;padding:2px 8px}
.tabs{display:flex;gap:18px;padding:6px 14px 0;background:#fff;font-size:15px;color:#555;overflow-x:auto;white-space:nowrap}
.tabs div{padding:6px 0 8px;position:relative;cursor:pointer}
.tabs div.on{color:#111;font-weight:700}
.tabs div.on:after{content:"";position:absolute;left:0;right:0;bottom:3px;height:3px;background:var(--or);border-radius:2px}
.chips{display:flex;gap:8px;padding:8px 14px;background:#fff;overflow-x:auto;white-space:nowrap}
.chips div{font-size:13px;color:#333;background:#f1f2f5;border-radius:6px;padding:6px 12px;cursor:pointer}
.chips div.on{background:var(--or2);color:var(--or);font-weight:600}
.sec{padding:10px 12px 0}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;position:relative}
.card h3{font-size:14.5px;margin-bottom:6px}
.card p{font-size:12.5px;color:var(--sub);line-height:1.6}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid #f3f3f5;gap:10px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;text-align:right}
.btn{display:inline-block;border-radius:22px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;text-align:center;border:1px solid var(--or);color:var(--or);background:#fff}
.btn.pri{background:var(--or);color:#fff}
.btn.buy{background:var(--up);border-color:var(--up);color:#fff}
.btn.sell{background:var(--dn);border-color:var(--dn);color:#fff}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.block{display:block;width:100%}
.btn.dis{opacity:.4;cursor:not-allowed}
.bd{display:inline-block;font-size:10.5px;border-radius:3px;padding:1px 5px;vertical-align:middle;margin-left:4px;font-weight:600}
.bd.new{background:var(--or);color:#fff}
.bd.mod{background:#fff;color:var(--or);border:1px solid var(--or)}
.bd.old{background:#f1f2f5;color:#8a8f99}
.bd{display:none}
body.marks .bd{display:inline-block}
.chip{display:inline-block;font-size:10.5px;border-radius:3px;padding:1px 5px;vertical-align:middle;margin-left:4px;font-weight:600;background:#f1f2f5;color:#8a8f99}
.explain{background:var(--or2);border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.6;margin-top:8px;color:#333}
.explain b{display:block;margin-bottom:3px}
.explain li{margin-left:16px}
.marksw{display:flex;gap:6px;align-items:center;font-size:12px;color:#333;margin-top:8px}
.more{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:12px 14px;margin:10px 12px 0;font-size:14px;cursor:pointer}
.mark{position:absolute;right:10px;top:10px}
.note{font-size:11px;color:#8f959e;line-height:1.55;padding:4px 14px 12px}
.up{color:var(--up)} .dn{color:var(--dn)}
/* 账户页 */
.acct{background:#fff;padding:8px 14px 12px}
.acct .total{font-size:30px;font-weight:700;margin:4px 0 8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 6px;font-size:12.5px}
.grid3 small{display:block;color:#666;font-size:12px;margin-bottom:2px}
.grid3 b{font-weight:600;font-size:14px}
.grid3 .r{text-align:right}
.holdhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px;font-size:18px;font-weight:700}
.cols{display:flex;font-size:12px;color:#666;padding:4px 14px}
.cols span:first-child{flex:1.3}.cols span{flex:1;text-align:right}
.hrow{display:flex;padding:10px 14px;background:#fff;align-items:center}
.hrow .n{flex:1.3}.hrow .n b{font-size:15px;display:block}.hrow .n small{color:#666;font-size:12px}
.hrow div{flex:1;text-align:right;font-size:14px}.hrow div small{display:block;color:#666;font-size:12px}
.quick{display:flex;background:#fff;padding:10px 6px;margin-top:1px}
.quick div{flex:1;text-align:center;font-size:12px;color:#444}.quick div span{display:block;font-size:20px}
.addon{margin:0 14px 8px;background:var(--or2);border-radius:10px;padding:10px 12px;position:relative}
.addon .t{font-weight:700;font-size:13.5px;margin-bottom:4px}
/* 个股期权策略 */
.hd2{background:#fff;padding:6px 14px 8px}
.hd2 .sym{font-size:19px;font-weight:700}
.hd2 .px{font-size:13px;color:var(--dn);margin-top:2px}
.dir{display:flex;justify-content:space-between;padding:10px 14px}
.dir div{width:46px;height:46px;border-radius:50%;background:#f1f2f5;display:flex;align-items:center;justify-content:center;font-size:18px;color:#999}
.dir div.on{border:1.5px solid var(--up);color:var(--up);background:#fff}
.frow{display:flex;align-items:center;padding:7px 14px;font-size:14px}
.frow span:first-child{width:72px;color:#333}
.frow .in{flex:1;border:1px solid #ddd;border-radius:6px;padding:9px 10px;font-size:14px;background:#fff;display:flex;justify-content:space-between}
.exp{display:flex;gap:8px;padding:6px 14px;overflow-x:auto;white-space:nowrap}
.exp div{border:1px solid #ddd;border-radius:6px;padding:6px 10px;font-size:13px;background:#fff;color:#444}
.exp div.on{border-color:#111;font-weight:700;color:#111}
.scard{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 12px 0;position:relative}
.scard h4{font-size:16px}
.scard .sub{font-size:13px;color:#666;margin:2px 0 8px}
.scard .m{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.scard .m span{color:#666}.scard .m b{font-weight:700}
.scard .m .r{text-align:right}
.scard .trade{position:absolute;right:14px;top:12px;border:1px solid #333;border-radius:14px;padding:3px 12px;font-size:12px;cursor:pointer}
.warn{background:var(--yellow);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.6;color:#7a5a00;margin:8px 0}
.danger{background:#fde8ef;color:#a3123f}
/* 下单页 */
.oform{background:#fff;padding:4px 14px}
.orow{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #f3f3f5;font-size:14px}
.orow span:first-child{width:72px;color:#333;text-decoration:underline dotted #999}
.orow .in{flex:1;border:1px solid #ddd;border-radius:6px;padding:9px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.orow .in.step{padding:0}
.stepper{display:flex;align-items:center;width:100%}
.stepper div{width:40px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:#333}
.stepper span{flex:1;text-align:center;font-weight:600}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#444;line-height:1.5;padding:8px 14px}
.chk input{margin-top:3px}
.obtns{display:flex;gap:12px;padding:12px 14px;align-items:center}
.obtns .btn{flex:1;padding:12px;font-size:16px}
.cash{display:flex;justify-content:space-between;font-size:12px;color:#666;padding:8px 14px}
.cash b{color:var(--up)}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;border-radius:34px}
.modal .box{background:#fff;border-radius:14px;padding:18px;width:300px}
.modal h4{font-size:15px;margin-bottom:8px}
.modal p{font-size:12.5px;color:#666;line-height:1.6}
.modal .btns{display:flex;gap:8px;margin-top:12px}
.modal .btns .btn{flex:1}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:8px 14px;border-radius:20px;z-index:30;white-space:nowrap}
/* 锁屏 */
.lock{background:linear-gradient(180deg,#5b6b8a,#2c3550);height:100%;color:#fff;padding:56px 14px 0;text-align:center}
.lock .time{font-size:64px;font-weight:200;letter-spacing:-2px}
.lock .date{font-size:15px;opacity:.85;margin-bottom:26px}
.notif{background:rgba(255,255,255,.95);color:#111;border-radius:16px;padding:12px 14px;text-align:left;margin-bottom:10px;cursor:pointer}
.notif .h{display:flex;justify-content:space-between;font-size:11px;color:#666;margin-bottom:3px}
.notif .h .app{display:flex;align-items:center;gap:5px}
.notif .h .app i{width:14px;height:14px;border-radius:4px;background:var(--or);display:inline-block}
.notif b{font-size:13.5px;display:block;margin-bottom:2px}
.notif p{font-size:12.5px;line-height:1.5}
/* 测评 */
.quiz{margin-bottom:12px}
.quiz .q{font-size:13.5px;font-weight:600;margin-bottom:8px;line-height:1.5}
.quiz .opt{border:1px solid #e3e3e8;border-radius:8px;padding:9px 10px;font-size:12.5px;margin-bottom:6px;cursor:pointer;line-height:1.5}
.quiz .opt.ok{border-color:var(--dn);background:#e8f8ef}
.quiz .opt.bad{border-color:var(--up);background:#fdeaee}
.quiz .ex{font-size:12px;color:#555;background:#f7f7f9;border-radius:8px;padding:8px 10px;line-height:1.6;margin-top:4px}
.prog{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--or)}
.steps{display:flex;gap:4px;margin:8px 0}
.steps div{flex:1;text-align:center;font-size:10.5px;color:#777;padding:6px 2px;background:#f1f2f5;border-radius:6px;line-height:1.3}
.steps div.done{background:#e8f8ef;color:var(--dn);font-weight:600}
.steps div.cur{background:var(--or);color:#fff;font-weight:600}
/* 课堂 */
.course{display:flex;gap:12px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid #f3f3f5}
.course .th{width:92px;height:62px;border-radius:8px;flex:none;display:flex;align-items:flex-end;padding:5px 6px;font-size:10px;color:#fff;font-weight:700;background:linear-gradient(135deg,#1c1f2b,#3a3f55)}
.course .th.o{background:linear-gradient(135deg,#ff6a00,#ff9a3c)}
.course .th.b{background:linear-gradient(135deg,#1f3b8a,#2d7cf6)}
.course .th.g{background:linear-gradient(135deg,#0d6b3f,#1ab36a)}
.course .th.r{background:linear-gradient(135deg,#8a1f2e,#e8344e)}
.course b{font-size:14px;display:block;line-height:1.35}
.course small{font-size:12px;color:#666;display:block;margin-top:2px}
.course .v{font-size:11px;color:#999;margin-top:3px;display:block}
.sh{font-size:17px;font-weight:700;padding:14px 14px 6px}
.cal{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f3f3f5;font-size:12.5px;line-height:1.5}
.cal:last-child{border-bottom:0}
.cal .d{width:52px;flex:none;font-weight:700;color:var(--or)}
.cm{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cm .u{font-size:12px;color:#666;display:flex;justify-content:space-between}
.cm p{font-size:13px;line-height:1.55;margin-top:3px}
.cm .ans{margin-top:6px;background:#f7f7f9;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.55}
.cm .ans b{color:var(--or)}
.home-card{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.home-card .num{width:28px;height:28px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.home-card b{font-size:13.5px;display:block}
.home-card small{font-size:11.5px;color:#666;line-height:1.4;display:block}
.home-card .arrow{color:#c9cdd4;font-size:18px}
.banner{background:#1f2329;color:#fff;font-size:11px;padding:7px 14px;line-height:1.5}
.mkt-row{display:flex;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid #f3f3f5;font-size:14px}
.mkt-row .lg{width:36px;height:36px;border-radius:50%;background:#1b2a4e;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;margin-right:10px}
.mkt-row .nm{flex:1}.mkt-row .nm small{display:block;color:#666;font-size:11px}
.mkt-row span{width:70px;text-align:right}
.bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--up) 0 55%,var(--dn) 55% 100%);margin:6px 0 4px}
.seg{display:flex;background:#f0f1f3;border-radius:8px;padding:3px;margin:8px 14px}
.seg div{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:6px;cursor:pointer;color:#666}
.seg div.on{background:#fff;color:#111;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media (max-width:820px){.layout{flex-direction:column;align-items:center;padding:10px 0}.guide{width:min(390px,100%);order:2;position:static;max-height:none}.phone{width:min(390px,100vw);height:min(820px,calc(100vh - 20px));border-radius:28px;padding:8px;position:static}.inner{border-radius:22px}.modal{border-radius:22px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="guide" id="guide"></aside>
  <div class="phone"><div class="inner">
    <div class="status"><span>9:41</span><span class="pill"></span><span>▮▮▮ 5G</span></div>
    <div class="screen" id="screen"></div>
    <nav class="tabbar" id="tabbar"></nav>
    <div id="overlay"></div>
  </div></div>
</div>
<script>
/* ===== 数据：2026-10-29 美股收盘（盈透 TWS 买卖中间价），与方案附件 A 一致 ===== */
const D={px:213.66,prev:215.38,ccK:240,ccP:1.45,ppK:200,ppP:3.78,itmK:190,itmP:25.93,itmDelta:0.86,otmK:230,otmP:3.25,leapK:180,leapP:38.63,leapDelta:0.85,leapExp:'2027-01-15',exp:'11-20',earn:'11-18',tsla:393.82};
const CAP=((D.ccK-D.px+D.ccP)*100).toFixed(0);
const ST={opened:false,simDone:false,ordered:false,qty:1,quiz:[null,null,null],tab:'cc',sub:'first',more:false,hold:'short'};

function payoff(type,w=330,h=120){
  const xs=[],ys=[];const lo=170,hi=280;
  for(let s=lo;s<=hi;s+=1){let y;
    if(type==='cc') y=(Math.min(s,D.ccK)-D.px+D.ccP)*100;
    else if(type==='pp') y=(Math.max(s,D.ppK)-D.px-D.ppP)*100;
    else if(type==='itm') y=(Math.max(s-D.itmK,0)-D.itmP)*100;
    else if(type==='leap') y=(Math.max(s-D.leapK,0)-D.leapP)*100;
    else y=(s-D.px)*100; xs.push(s);ys.push(y);}
  const stock=xs.map(s=>(s-D.px)*100);
  const ymin=Math.min(...ys,...stock),ymax=Math.max(...ys,...stock);
  const X=s=>12+(s-lo)/(hi-lo)*(w-24), Y=v=>10+(ymax-v)/(ymax-ymin)*(h-30);
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const col={cc:'#ff6a00',pp:'#2d7cf6',itm:'#1ab36a',leap:'#1ab36a'}[type];
  const be={cc:D.px-D.ccP,pp:D.px+D.ppP,itm:D.itmK+D.itmP,leap:D.leapK+D.leapP}[type];
  const pos=ys.map((v,i)=>v>=0?`${X(xs[i]).toFixed(1)},${Y(v).toFixed(1)}`:null).filter(Boolean);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">
   <line x1="12" x2="${w-12}" y1="${Y(0)}" y2="${Y(0)}" stroke="#ccc"/>
   <line x1="${X(D.px)}" x2="${X(D.px)}" y1="8" y2="${h-18}" stroke="#999" stroke-dasharray="3 3"/>
   <path d="${path(stock)}" fill="none" stroke="#b0b4bd" stroke-width="1.5" stroke-dasharray="4 3"/>
   <path d="${path(ys)}" fill="none" stroke="${col}" stroke-width="2.6"/>
   <circle cx="${X(be)}" cy="${Y(0)}" r="3.5" fill="${col}"/>
   <text x="${X(D.px)+3}" y="18" font-size="9" fill="#666">现价 ${D.px}</text>
   <text x="${Math.min(X(be)+4,w-70)}" y="${Y(0)-6}" font-size="9" fill="${col}">${be.toFixed(2)} 开始赚</text>
   <text x="12" y="${h-4}" font-size="8.5" fill="#999">灰虚线＝只持 100 股 · 横轴＝到期日 ${type==='leap'?D.leapExp:D.exp} 股价 170～280 美元</text></svg>`;
}
