<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">

<title>期权首单 · 产品能力 Demo</title>
<meta name="description" content="《期权未首交用户促转化：三个月方案》配套的可交互 demo：持仓页入口、策略模板、首单保护、模拟盘、复盘卡片、新手指南。通用券商 App 示意，不代表任何真实产品。">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1f2329;--sub:#646a73;--line:#e5e6eb;--blue:#2f6bff;--blue2:#eaf0ff;--green:#1db36b;--red:#e0245e;--orange:#ff7a00;--yellow:#fff4d6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:#e9ebf0;color:var(--ink);min-height:100vh}
a{color:var(--blue)}
.layout{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:28px 16px}
.guide{width:360px;flex:none;background:#fff;border-radius:14px;padding:18px;border:1px solid var(--line)}
.guide h1{font-size:17px;margin-bottom:6px}
.guide p{font-size:13px;color:var(--sub);line-height:1.6}
.guide .list{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.guide .item{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:13px;line-height:1.5}
.guide .item:hover{background:#f7f8fa}
.guide .item.on{border-color:var(--blue);background:var(--blue2)}
.guide .item b{display:block}
.guide .item .tag{font-size:11px;color:var(--blue);background:var(--blue2);border-radius:4px;padding:1px 6px;display:inline-block;margin-top:3px}
.guide .item.on .tag{background:#fff}
.guide .foot{font-size:11px;color:#8f959e;line-height:1.6;margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.phone{width:390px;flex:none;height:800px;background:#000;border-radius:44px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
.inner{background:var(--bg);border-radius:34px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:600;background:#fff}
.status .pill{width:110px;height:28px;background:#000;border-radius:14px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.tabbar{height:58px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center}
.tabbar div{flex:1;text-align:center;font-size:11px;color:var(--sub);cursor:pointer;padding-top:2px}
.tabbar div span{display:block;font-size:18px;line-height:22px}

.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
.card h3{font-size:14px;margin-bottom:6px}
.card p{font-size:12.5px;color:var(--sub);line-height:1.6}
.card .big{font-size:22px;font-weight:700;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}

.btn{display:inline-block;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;border:1px solid var(--blue);color:var(--blue);background:#fff}
.btn.pri{background:var(--blue);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.block{display:block;width:100%}
.btn.dis{opacity:.4;cursor:not-allowed}
.tagline{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;background:var(--blue2);color:var(--blue);margin-right:4px}
.tagline.g{background:#e6f7ee;color:var(--green)}
.tagline.o{background:#fff1e5;color:var(--orange)}
.tagline.r{background:#fde8ef;color:var(--red)}
.note{font-size:11px;color:#8f959e;line-height:1.5;padding:6px 14px 12px}
.sect{font-size:13px;font-weight:700;color:var(--ink);margin:4px 0 8px}
.pos{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pos:last-child{border-bottom:0}
.pos .n{font-weight:600;font-size:14px}
.pos .s{font-size:11px;color:var(--sub)}
.up{color:var(--red)} .dn{color:var(--green)}
.tpl{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.tpl.rec{border-color:var(--blue)}
.tpl h4{font-size:14px;margin-bottom:2px}
.tpl .one{font-size:12px;color:var(--sub);margin-bottom:6px}
.tpl .ct{font-size:12.5px;background:#f7f8fa;border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.6}
.tpl .btns{display:flex;gap:8px;margin-top:6px}
.tpl .btns .btn{flex:1}
.seg{display:flex;background:#f0f1f3;border-radius:8px;padding:3px;margin:8px 0}
.seg div{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:6px;cursor:pointer;color:var(--sub)}
.seg div.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.stepper span{width:40px;text-align:center;font-weight:600}
.warn{background:var(--yellow);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.6;color:#7a5a00;margin:8px 0}
.danger{background:#fde8ef;color:#a3123f}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--sub);line-height:1.5;margin:8px 0}
.chk input{margin-top:3px}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;border-radius:34px}
.modal .box{background:#fff;border-radius:14px;padding:18px;width:300px}
.modal h4{font-size:15px;margin-bottom:8px}
.modal p{font-size:12.5px;color:var(--sub);line-height:1.6}
.modal .btns{display:flex;gap:8px;margin-top:12px}
.modal .btns .btn{flex:1}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:8px 14px;border-radius:20px;z-index:30;white-space:nowrap}
.lock{background:linear-gradient(180deg,#5b6b8a,#2c3550);height:100%;color:#fff;padding:60px 16px 0;text-align:center}
.lock .time{font-size:64px;font-weight:200;letter-spacing:-2px}
.lock .date{font-size:15px;opacity:.85;margin-bottom:30px}
.notif{background:rgba(255,255,255,.95);color:var(--ink);border-radius:16px;padding:12px 14px;text-align:left;margin-bottom:10px;cursor:pointer}
.notif .h{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:3px}
.notif b{font-size:13.5px;display:block;margin-bottom:2px}
.notif p{font-size:12.5px;line-height:1.5}
.quiz{margin-bottom:10px}
.quiz .q{font-size:13.5px;font-weight:600;margin-bottom:8px;line-height:1.5}
.quiz .opt{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12.5px;margin-bottom:6px;cursor:pointer;line-height:1.5}
.quiz .opt.ok{border-color:var(--green);background:#e6f7ee}
.quiz .opt.bad{border-color:var(--red);background:#fde8ef}
.quiz .exp{font-size:12px;color:var(--sub);background:#f7f8fa;border-radius:8px;padding:8px 10px;line-height:1.6;margin-top:4px}
.prog{height:6px;background:#e5e6eb;border-radius:3px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--blue)}
.course{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.course:last-child{border-bottom:0}

.course small{font-size:11.5px;color:var(--sub)}
.course .st{font-size:11px;color:var(--green);flex:none}
.cal{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5}
.cal:last-child{border-bottom:0}
.cal .d{width:52px;flex:none;font-weight:700;color:var(--orange)}
.steps{display:flex;gap:4px;margin:8px 0}
.steps div{flex:1;text-align:center;font-size:10.5px;color:var(--sub);padding:6px 2px;background:#f0f1f3;border-radius:6px;line-height:1.3}
.steps div.done{background:#e6f7ee;color:var(--green);font-weight:600}
.steps div.cur{background:var(--blue);color:#fff;font-weight:600}
.home-card{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.home-card .num{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.home-card b{font-size:13.5px;display:block}
.home-card small{font-size:11.5px;color:var(--sub);line-height:1.4;display:block}
.home-card .arrow{color:#c9cdd4;font-size:18px}
.banner{background:#1f2329;color:#fff;font-size:11px;padding:7px 14px;line-height:1.5}
.cm{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.cm .u{font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
.cm p{font-size:13px;line-height:1.55;margin-top:3px}
.cm .ans{margin-top:6px;background:#f7f8fa;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.55}
.cm .ans b{color:var(--blue)}
@media (max-width:820px){.layout{flex-direction:column;align-items:center;padding:10px 0}.guide{width:min(390px,100%);order:2}.phone{width:min(390px,100vw);height:min(800px,calc(100vh - 20px));border-radius:28px;padding:8px}.inner{border-radius:22px}.modal{border-radius:22px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="guide" id="guide"></aside>
  <div class="phone"><div class="inner">
    <div class="status"><span>9:41</span><span class="pill"></span><span>▮▮▮ 5G</span></div>
    <div class="screen" id="screen"></div>
    <nav class="tabbar" id="tabbar"></nav>
    <div id="overlay"></div>
  </div></div>
</div>
<script>
/* ===== 数据：全部取 2026-10-29 美股收盘（盈透 TWS 买卖中间价），与方案附件 A 一致 ===== */
const D={px:213.66,ccK:240,ccP:1.45,ppK:200,ppP:3.78,itmK:190,itmP:25.93,itmDelta:0.86,otmK:230,otmP:3.25,exp:'11-20',earn:'11-18'};
const CAP=((D.ccK-D.px+D.ccP)*100).toFixed(0); // 2779
const ST={opened:false,simDone:false,ordered:false,qty:1,quiz:[null,null,null],tab:'cc'};
const fmt=n=>Number(n).toLocaleString('en-US');

/* ===== 页面清单：id、名称、对应方案章节、看点 ===== */
const SCREENS=[
 {id:'home',name:'导览：按用户的路径点下去',tag:'全文',note:'从一条推送开始，走到第二单。'},
 {id:'push',name:'① 分层推送（锁屏通知）',tag:'3.3 阶段 · 4.2 行情日历',note:'同一个人不同阶段收到的不是同一条。'},
 {id:'positions',name:'② 持仓页「这只股票能怎么用期权」',tag:'五-1 持仓页入口（P0）',note:'数字直接是他持仓的合约，不是广告。'},
 {id:'templates',name:'③ 第一单模板：三选一',tag:'五-2 策略模板一键下单（P0）',note:'合约自动推荐，不用看期权链；每个模板先讲最坏情况。'},
 {id:'onboard',name:'④ 开通流程：情景题代替风险测评',tag:'五-6 开通流程嵌教育（P1）',note:'答题就是学习，开通成功页直接给第一单建议。'},
 {id:'sim',name:'⑤ 模拟盘一单',tag:'五-5 模拟盘（P1）· 六 首单任务阶梯',note:'真实报价，到期自动结算并推复盘。'},
 {id:'order',name:'⑥ 确认下单：首单模式',tag:'五-3 最大亏损与损益图 · 五-4 首单保护（P0/P1）',note:'最多亏多少、哪里开始赚，数字和图同屏；张数超限弹二次确认。'},
 {id:'review',name:'⑦ 首单复盘卡片 → 第二单',tag:'4.1「做了」档 · 六 第 3 个月',note:'到期后 7 天内，把结果讲清楚，顺手给下一单。'},
 {id:'guide',name:'⑧ 期权新手指南（常驻入口）',tag:'4.1 官方内容',note:'四课按顺序看，末尾直接接模拟盘。'},
 {id:'market',name:'⑨ 市场 · 期权 Tab',tag:'4.2 行情日历 · 4.3 社区创作者',note:'周报、财报日历、创作者老带新、晒单精选。'},
 {id:'ask',name:'⑩ 新手提问区',tag:'4.3 用户内容',note:'24 小时内答，高频问题沉淀进指南第 4 课。'},
];

/* ===== 损益图（SVG） ===== */
function payoff(type,w=330,h=130){
  const xs=[],ys=[];const lo=170,hi=280;
  for(let s=lo;s<=hi;s+=1){let y;
    if(type==='cc') y=(Math.min(s,D.ccK)-D.px+D.ccP)*100;
    else if(type==='pp') y=(Math.max(s,D.ppK)-D.px-D.ppP)*100;
    else if(type==='itm') y=(Math.max(s-D.itmK,0)-D.itmP)*100;
    else y=(s-D.px)*100;
    xs.push(s);ys.push(y);}
  const stock=xs.map(s=>(s-D.px)*100);
  const ymin=Math.min(...ys,...stock),ymax=Math.max(...ys,...stock);
  const X=s=>12+(s-lo)/(hi-lo)*(w-24), Y=v=>10+(ymax-v)/(ymax-ymin)*(h-30);
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const col={cc:'#ff7a00',pp:'#2f6bff',itm:'#1db36b'}[type];
  const be={cc:D.px-D.ccP,pp:D.px+D.ppP,itm:D.itmK+D.itmP}[type];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">
   <line x1="12" x2="${w-12}" y1="${Y(0)}" y2="${Y(0)}" stroke="#ccc"/>
   <line x1="${X(D.px)}" x2="${X(D.px)}" y1="8" y2="${h-18}" stroke="#2f6bff" stroke-dasharray="3 3"/>
   <path d="${path(stock)}" fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3"/>
   <path d="${path(ys)}" fill="none" stroke="${col}" stroke-width="2.6"/>
   <circle cx="${X(be)}" cy="${Y(0)}" r="3.5" fill="${col}"/>
   <text x="${X(D.px)+3}" y="18" font-size="9" fill="#2f6bff">现价 ${D.px}</text>
   <text x="${Math.min(X(be)+4,w-70)}" y="${Y(0)-6}" font-size="9" fill="${col}">${be.toFixed(2)} 开始赚</text>
   <text x="12" y="${h-4}" font-size="8.5" fill="#8f959e">灰虚线＝只持 100 股；横轴＝到期日 ${D.exp} 股价（170～280 美元）</text>
  </svg>`;
}

/* ===== 各页面 ===== */
const V={};
const hdr=(t,back='home')=>`<div class="top"><span class="back" onclick="go('${back}')">‹</span><b>${t}</b><span class="home" onclick="go('home')">导览</span></div>`;

V.home=()=>`<div class="banner">方案《期权未首交用户促转化：三个月方案》配套 demo · 通用券商 App 示意，不代表任何真实产品 · 数据为 2026-10-29 美股收盘，不构成投资建议</div>
<div class="sec">
<div class="card"><h3>一个持有 100 股英伟达、没做过期权的用户，三个月里会看到什么</h3><p>按下面顺序点，就是方案第三到第六节落到产品上的样子。每一页右上角「导览」可回到这里；左侧（手机上在下方）标了每页对应方案的章节。</p></div>
${SCREENS.slice(1).map((s,i)=>`<div class="home-card" onclick="go('${s.id}')"><div class="num">${i+1}</div><div style="flex:1"><b>${s.name.replace(/^[①-⑩]\s?/,'')}</b><small>${s.tag} · ${s.note}</small></div><span class="arrow">›</span></div>`).join('')}
<div class="note">当前状态：${ST.opened?'已开通期权权限':'未开通期权权限'} · ${ST.simDone?'已做模拟盘一单':'未做模拟盘'} · ${ST.ordered?'已提交真实首单':'未下真实首单'}　<a href="#" onclick="reset();return false">重置</a></div>
</div>`;

V.push=()=>`<div class="lock"><div class="time">9:41</div><div class="date">10 月 30 日 星期五</div>
<div class="notif" onclick="go('positions')"><div class="h"><span>券商 App · 持仓提醒</span><span>现在</span></div><b>财报前，持有英伟达的你可以先收一笔</b><p>持有 100 股英伟达，卖 1 张 240 Call 现在能收 ${(D.ccP*100).toFixed(0)} 美元；跌时少亏一点，涨过 240 收益封顶。第一张期权，先从看得懂的做起。</p></div>
<div class="notif" onclick="go('sim')"><div class="h"><span>券商 App · 给「看过未开通」的人</span><span>昨天</span></div><b>你昨天看的那张合约，先用模拟盘做一单</b><p>不花钱、用真实报价，到期告诉你结果。做完送 50 积分。</p></div>
<div class="notif" onclick="go('review')"><div class="h"><span>券商 App · 给「已下首单」的人</span><span>到期日</span></div><b>你的第一张备兑到期了</b><p>这次收了 ${(D.ccP*100).toFixed(0)} 美元，Call 作废。点开看复盘和下一单。</p></div>
<p style="font-size:11.5px;opacity:.8;margin-top:14px;line-height:1.6">同一个持仓型用户，在「未接触 / 看过未开通 / 已下首单」三个阶段收到的是三条不同的推送（方案 3.3）。点任意一条进入。</p></div>`;

V.positions=()=>`${hdr('持仓','push')}
<div class="sec">
<div class="card"><div class="row"><div><p>总资产（美元）</p><div class="big">38,412.60</div></div><div style="text-align:right"><p>今日盈亏</p><div class="big dn" style="font-size:18px">−428.00</div></div></div></div>
<div class="sect">持仓</div>
<div class="card">
 <div class="pos"><div><div class="n">英伟达 NVDA</div><div class="s">100 股 · 成本 200.00</div></div><div style="text-align:right"><div class="n">${D.px}</div><div class="s up">+1,366.00 (+6.83%)</div></div></div>
 <div style="background:var(--blue2);border-radius:10px;padding:10px 12px;margin:6px 0 4px">
  <div class="row"><b style="font-size:13.5px">这 100 股能怎么用期权</b><span class="tagline o">财报 ${D.earn}</span></div>
  <div class="kv"><span>本周卖 1 张 240 Call 能收</span><b class="up">${(D.ccP*100).toFixed(0)} 美元</b></div>
  <div class="kv"><span>财报前保护到 200 美元要花</span><b>${(D.ppP*100).toFixed(0)} 美元</b></div>
  <div class="kv"><span>两个都做（领口）</span><b>净花 ${((D.ppP-D.ccP)*100).toFixed(0)} 美元</b></div>

/* ===== 框架 ===== */
const TABS=[['自选','☆','market'],['市场','◎','market'],['账户','▤','positions'],['发现','✦','guide'],['交易','⇄','order']];
let cur='home';
function go(id){if(!V[id])id='home';cur=id;document.getElementById('screen').innerHTML=V[id]();document.getElementById('screen').scrollTop=0;
 document.getElementById('tabbar').innerHTML=TABS.map(t=>`<div class="${t[2]===id?'on':''}" onclick="go('${t[2]}')"><span>${t[1]}</span>${t[0]}</div>`).join('');
 renderGuide();if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);}
function renderGuide(){const g=document.getElementById('guide');g.innerHTML=`<h1>期权首单 · 产品能力 Demo</h1><p>《期权未首交用户促转化：三个月方案》第三～六节落到产品上的样子。通用券商 App 示意，不代表任何真实产品；数据为 2026-10-29 美股收盘（英伟达 ${D.px}），不构成投资建议。</p>
 <div class="list">${SCREENS.map(s=>`<div class="item ${s.id===cur?'on':''}" onclick="go('${s.id}')"><b>${s.name}</b><span class="tag">${s.tag}</span><div style="color:var(--sub);margin-top:2px">${s.note}</div></div>`).join('')}</div>
 <div class="foot">每页右下「说明」灰字写了对应方案哪一条。页面地址带 #，可以直接链到某一页，例如 #order 是确认下单页。<br>英伟达 ${D.exp} 到期：240 Call ${D.ccP}、200 Put ${D.ppP}、190 Call ${D.itmP}（delta ${D.itmDelta}）、230 Call ${D.otmP}。</div>`;}
function toast(t){const o=document.getElementById('overlay');const e=document.createElement('div');e.className='toast';e.textContent=t;o.appendChild(e);setTimeout(()=>e.remove(),1800);}
function modal(h,p,btns){document.getElementById('overlay').innerHTML=`<div class="modal"><div class="box"><h4>${h}</h4><p>${p}</p><div class="btns">${btns.map((b,i)=>`<div class="btn ${i?'pri':''}" onclick="MB[${i}]()">${b[0]}</div>`).join('')}</div></div></div>`;window.MB=btns.map(b=>b[1]);}
function closeModal(){document.getElementById('overlay').innerHTML='';}
function reset(){Object.assign(ST,{opened:false,simDone:false,ordered:false,qty:1,quiz:[null,null,null],tab:'cc'});go('home');}
window.addEventListener('hashchange',()=>go(location.hash.slice(1)||'home'));
go(location.hash.slice(1)||'home');
