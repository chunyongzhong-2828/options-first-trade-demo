<script>
/* ===== 数据：2026-10-29 美股收盘（盈透 TWS 买卖中间价），与方案附件 A 一致 ===== */
const D={px:213.66,prev:215.38,ccK:240,ccP:1.45,ppK:200,ppP:3.78,itmK:190,itmP:25.93,itmDelta:0.86,otmK:230,otmP:3.25,exp:'11-20',earn:'11-18',tsla:393.82};
const CAP=((D.ccK-D.px+D.ccP)*100).toFixed(0);
const ST={opened:false,simDone:false,ordered:false,qty:1,quiz:[null,null,null],tab:'cc',sub:'first'};
const fmt=n=>Number(n).toLocaleString('en-US');
const NEW='<span class="bd new">方案新增</span>',MOD='<span class="bd mod">方案修改</span>',OLD='<span class="bd old">现有</span>';

const SCREENS=[
 {id:'home',name:'导览：按用户的路径点下去',tag:'全文',note:'从一条推送开始，走到第二单。'},
 {id:'push',name:'① 分层推送（锁屏通知）',tag:'3.3 阶段 · 4.2 行情日历',note:'同一个人在不同阶段收到的不是同一条。'},
 {id:'positions',name:'② 账户页：持仓下面加一张卡',tag:'五-1 持仓页入口（P0）',note:'现有账户页不动，持仓行下方新增「这只股票能怎么用期权」。'},
 {id:'templates',name:'③ 个股期权 Tab：新增「第一单」子页',tag:'五-2 策略模板一键下单（P0）',note:'放在期权链前面；现有「期权策略」保留，首单用户默认不见买入虚值看涨。'},
 {id:'onboard',name:'④ 开通流程：情景题',tag:'五-6 开通流程嵌教育（P1）',note:'答题就是学习，开通成功页直接给第一单。'},
 {id:'sim',name:'⑤ 模拟盘一单',tag:'五-5 模拟盘（P1）· 六 首单任务阶梯',note:'真实报价，到期自动结算并推复盘。'},
 {id:'order',name:'⑥ 下单页：加「首单模式」',tag:'五-3 最大亏损与损益图 · 五-4 首单保护',note:'现有下单页字段不动，插入最大亏损与损益图、张数上限、风险确认。'},
 {id:'review',name:'⑦ 首单复盘卡片 → 第二单',tag:'4.1「做了」档 · 六 第 3 个月',note:'到期后 7 天内讲清楚结果，顺手给下一单。'},
 {id:'guide',name:'⑧ 期权课堂：顶部加「新手指南」',tag:'4.1 官方内容',note:'现有课程保留；新增四课从用户持仓讲起，末尾接模拟盘。'},
 {id:'market',name:'⑨ 市场 · 期权 Tab：加周报与日历',tag:'4.2 行情日历 · 4.3 社区创作者',note:'现有异动、市场总览、期权课堂保留；上方新增持仓周报、行情日历、创作者老带新。'},
 {id:'ask',name:'⑩ 新手提问区',tag:'4.3 用户内容',note:'24 小时内答，高频问题沉淀进指南第 4 课。'},
];

function payoff(type,w=330,h=120){
  const xs=[],ys=[];const lo=170,hi=280;
  for(let s=lo;s<=hi;s+=1){let y;
    if(type==='cc') y=(Math.min(s,D.ccK)-D.px+D.ccP)*100;
    else if(type==='pp') y=(Math.max(s,D.ppK)-D.px-D.ppP)*100;
    else if(type==='itm') y=(Math.max(s-D.itmK,0)-D.itmP)*100;
    else y=(s-D.px)*100; xs.push(s);ys.push(y);}
  const stock=xs.map(s=>(s-D.px)*100);
  const ymin=Math.min(...ys,...stock),ymax=Math.max(...ys,...stock);
  const X=s=>12+(s-lo)/(hi-lo)*(w-24), Y=v=>10+(ymax-v)/(ymax-ymin)*(h-30);
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const col={cc:'#ff6a00',pp:'#2d7cf6',itm:'#1ab36a'}[type];
  const be={cc:D.px-D.ccP,pp:D.px+D.ppP,itm:D.itmK+D.itmP}[type];
  const pos=ys.map((v,i)=>v>=0?`${X(xs[i]).toFixed(1)},${Y(v).toFixed(1)}`:null).filter(Boolean);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">
   <line x1="12" x2="${w-12}" y1="${Y(0)}" y2="${Y(0)}" stroke="#ccc"/>
   <line x1="${X(D.px)}" x2="${X(D.px)}" y1="8" y2="${h-18}" stroke="#999" stroke-dasharray="3 3"/>

function modal(h,p,btns){document.getElementById('overlay').innerHTML=`<div class="modal"><div class="box"><h4>${h}</h4><p>${p}</p><div class="btns">${btns.map((b,i)=>`<div class="btn ${i?'pri':''}" onclick="MB[${i}]()">${b[0]}</div>`).join('')}</div></div></div>`;window.MB=btns.map(b=>b[1]);}
